services:
  - type: web
    name: kanb-plant
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORDER_ACCESS_SECRET
        generateValue: true
      - key: DIAGNOSIS_DATA_BACKEND
        value: supabase
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: OPENAI_API_KEY
        sync: false
      - key: PLANTNET_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_AUTH_EMAIL_REDIRECT_URL
        sync: false
      - key: VITE_ENABLE_DEMO_AUTH
        value: 'false'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: WOOCOMMERCE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
  - type: cron
    name: kanb-plant-audit-prune
    runtime: node
    rootDir: .
    schedule: '0 20 * * *'
    buildCommand: npm ci
    startCommand: npm run audit:prune
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIAGNOSIS_DATA_BACKEND
        value: supabase
      - key: DIAGNOSIS_RETENTION_DAYS
        value: '90'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
